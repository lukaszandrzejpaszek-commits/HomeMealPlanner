<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>History display tests</title></head>
<body>
<pre id="result">Running...</pre>
<script>
    const stored = {};
    Object.defineProperty(window, 'localStorage', { value: {
        getItem: key => Object.hasOwn(stored, key) ? stored[key] : null,
        setItem: (key, value) => { stored[key] = String(value); },
        removeItem: key => { delete stored[key]; }
    } });
</script>
<script src="../js/storage.js"></script>
<script src="../js/repository.js"></script>
<script src="../js/rules.js"></script>
<script src="../js/planner.js"></script>
<script src="../js/history.js"></script>
<script>
    window.addEventListener('DOMContentLoaded', () => {
        const script = document.createElement('script');
        script.src = '../js/ui.js';
        script.onerror = () => { document.getElementById('result').textContent = 'FAILED: UI script did not load'; };
        script.onload = () => {
            const assert = (condition, message) => { if (!condition) throw new Error(message); };
            try {
                window.storage.set('rules', [{ id: 'avoid-same-meal-day', enabled: false, strength: 23 }]);
                const migratedStorage = new window.storage.constructor();
                let migratedRules = migratedStorage.get('rules');
                assert(migratedRules.find(rule => rule.id === 'component-repeat-policy')?.enabled &&
                    !migratedRules.some(rule => rule.id === 'avoid-same-meal-day') &&
                    migratedRules.find(rule => rule.id === 'vary-sides')?.enabled,
                    'Legacy repeat rules must be replaced and side variety added');
                new window.storage.constructor();
                assert(migratedStorage.get('rules').filter(rule => rule.id === 'component-repeat-policy').length === 1,
                    'Reloading must not duplicate the combined rule');
                migratedStorage.set('rules', [{
                    id: 'component-repeat-policy', type: 'builtin', name: 'Old name',
                    description: 'Old description', enabled: false, strength: 100
                }]);
                new window.storage.constructor();
                const updatedWeekly = migratedStorage.get('rules').find(rule => rule.id === 'component-repeat-policy');
                assert(updatedWeekly.name === 'Limit repeated components' &&
                    updatedWeekly.description.includes('Starch and vegetables can repeat') && !updatedWeekly.enabled,
                    'Updating the combined rule description must preserve its enabled state');
                migratedStorage.importData(JSON.stringify({
                    rules: [{ id: 'avoid-same-meal-day', enabled: false, strength: 23 },
                        { id: 'balance-cuisine', enabled: false, strength: 23 }]
                }));
                migratedRules = migratedStorage.get('rules');
                assert(migratedRules.find(rule => rule.id === 'component-repeat-policy')?.enabled &&
                    migratedRules.find(rule => rule.id === 'vary-sides')?.enabled &&
                    !migratedRules.find(rule => rule.id === 'balance-cuisine').enabled &&
                    migratedRules.find(rule => rule.id === 'balance-cuisine').strength === 23,
                    'Restoring an older backup must consolidate repeat rules and preserve other settings');
                migratedRules.find(rule => rule.id === 'vary-sides').enabled = false;
                migratedRules.find(rule => rule.id === 'vary-sides').strength = 25;
                migratedStorage.set('rules', migratedRules);
                new window.storage.constructor();
                const migratedVariety = migratedStorage.get('rules').find(rule => rule.id === 'vary-sides');
                assert(!migratedVariety.enabled && migratedVariety.strength === 25,
                    'Reloading must preserve side variety settings');
                const ui = new UIManager();
                const repeatItem = ui.createRuleItem(migratedRules.find(rule => rule.id === 'component-repeat-policy'));
                assert(repeatItem.querySelector('.toggle-switch') && !repeatItem.querySelector('.rule-strength-slider'),
                    'The combined strict rule must have a toggle but no misleading strength slider');
                const mealPrepCount = document.createElement('div');
                mealPrepCount.id = 'meal-prep-count';
                const cuisineSummary = document.createElement('div');
                cuisineSummary.id = 'cuisine-summary';
                document.body.append(mealPrepCount, cuisineSummary);
                ui.updateDashboardStats({
                    Monday: { breakfast: { id: '1', cuisine: 'Home' },
                        lunch: { id: '2', cuisine: 'Indian' }, dinner: { id: '3', cuisine: 'Indian' } },
                    Tuesday: { lunch: { id: '4', cuisine: 'polish' } }
                });
                const flags = cuisineSummary.querySelectorAll('img.cuisine-flag');
                const homeIcon = cuisineSummary.querySelector('.cuisine-home-icon');
                assert(cuisineSummary.textContent === 'Indian (2), 🏠Home (1), polish (1)' &&
                    flags.length === 2 && flags[0].src.endsWith('/assets/flags/in.svg') &&
                    flags[1].src.endsWith('/assets/flags/pl.svg') &&
                    [...flags].every(flag => flag.alt === '') &&
                    homeIcon?.getAttribute('aria-hidden') === 'true',
                    'Cuisine balance must show flags and a decorative house for Home');
                ui.updateDashboardStats({ Monday: { lunch: { id: '5', cuisine: 'Regional' } } });
                assert(cuisineSummary.textContent === 'Regional (1)' && !cuisineSummary.querySelector('img, span'),
                    'Unrecognized cuisines must remain readable without an icon');
                ui.updateDashboardStats({});
                assert(cuisineSummary.textContent === 'No meals planned',
                    'Cuisine balance must retain its empty state');
                mealPrepCount.remove();
                cuisineSummary.remove();
                const history = ui.createHistoryItem({
                    key: 'test', weekNumber: 46, year: 2026, approvedDate: '2026-11-14T12:00:00Z',
                    weekStartDate: '2026-11-14', weekEndDate: '2026-11-20',
                    plan: {
                        Saturday: {
                            breakfast: { name: 'A very long breakfast <b>name</b>' },
                            schoolLunch: true, lunch: { name: 'Ignored lunch' }, dinner: null
                        },
                        Sunday: { lunch: { name: 'Sunday lunch' } }
                    }
                });
                const days = history.querySelectorAll('.history-day-preview');
                assert(days.length === 7 && days[0].querySelector('.history-day-preview-title').textContent === 'Sat' &&
                    days[1].querySelector('.history-day-preview-title').textContent === 'Sun',
                    'Days must follow the saved week start');
                const saturday = Array.from(days[0].querySelectorAll('.history-meal'), row => row.textContent);
                assert(saturday.join('|') === 'Breakfast: A very long breakfast <b>name</b>|Lunch: School Lunch|Dinner: Not planned',
                    'Each day must show the full breakfast, school lunch and unplanned dinner in order');
                assert(!days[0].querySelector('b'), 'Meal names must be displayed as text');
                const sunday = Array.from(days[1].querySelectorAll('.history-meal'), row => row.textContent);
                assert(sunday.join('|') === 'Breakfast: Not planned|Lunch: Sunday lunch|Dinner: Not planned',
                    'Missing meals must retain their labelled lines');
                assert(days[2].querySelectorAll('.history-meal').length === 3,
                    'Days missing from saved history must still have three lines');
                assert(history.querySelector('[data-action="edit"]') &&
                    history.querySelector('[data-action="delete"]') && history.querySelector('[data-action="copy"]'),
                    'Each entry must offer edit, delete and copy actions');

                window.storage.set('settings', { planningStartDay: 'Monday' });
                window.planner.setTargetWeek('2026-W46');
                const originalCurrent = window.planner.getCurrentWeekInfo().weekKey;
                const originalPlan = {
                    Saturday: { breakfast: { id: 'old', name: 'Old breakfast', cuisine: 'Home',
                        protein: 'N/A', difficulty: 'Easy', ingredients: [] }, schoolLunch: false }
                };
                const dates = { weekKey: '2026-W46@2026-11-14',
                    weekStartDate: '2026-11-14', weekEndDate: '2026-11-20' };
                window.storage.saveToHistory(46, 2026, originalPlan, { totalMeals: 1 }, dates);
                const key = dates.weekKey;
                const duplicateKey = `${key}#2`;
                const otherKey = '2026-W46';
                const otherDates = { weekKey: otherKey,
                    weekStartDate: '2026-11-09', weekEndDate: '2026-11-15' };
                window.storage.saveToHistory(46, 2026, originalPlan, { totalMeals: 1 }, otherDates);
                const initialHistory = window.storage.get('history');
                initialHistory[duplicateKey] = { ...structuredClone(initialHistory[key]), key: duplicateKey };
                window.storage.set('history', initialHistory);
                const untouchedWeek = JSON.stringify(initialHistory[otherKey]);
                window.planner.editHistoryEntry(duplicateKey);
                assert(window.planner.getCurrentWeekInfo().weekStartDate === '2026-11-14' &&
                    window.planner.getCurrentWeek().status === 'Draft' &&
                    window.planner.getCurrentWeek().editingHistoryKey === duplicateKey &&
                    window.storage.get('weekly-plans')[originalCurrent],
                    'Editing must open the original start day as a draft without losing the previous week');
                window.planner.setSchoolLunch(0, true);
                assert(!window.storage.get('history')[key].plan.Saturday.schoolLunch,
                    'Draft edits must not change the history snapshot before approval');
                const reopened = new window.planner.constructor(window.storage, window.repository, window.ruleEngine);
                assert(reopened.getCurrentWeekInfo().weekStartDate === '2026-11-14' &&
                    reopened.getCurrentWeek().plan.Saturday.schoolLunch,
                    'A history draft with a different start day must survive reload');
                reopened.editHistoryEntry(duplicateKey);
                assert(reopened.getCurrentWeek().plan.Saturday.schoolLunch,
                    'Reopening an unfinished history edit must preserve the draft');
                reopened.generateWeekPlan();
                assert(reopened.getCurrentWeek().editingHistoryKey === duplicateKey &&
                    reopened.getCurrentWeek().plan.Saturday.schoolLunch,
                    'Generating the week must retain the selected history entry');
                reopened.approvePlan();
                let savedHistory = window.storage.get('history');
                assert(Object.keys(savedHistory).length === 2 && savedHistory[key].plan.Saturday.schoolLunch &&
                    !savedHistory[duplicateKey] && JSON.stringify(savedHistory[otherKey]) === untouchedWeek &&
                    reopened.getCurrentWeek().status === 'Approved' &&
                    !reopened.getCurrentWeek().editingHistoryKey,
                    'Approval must consolidate duplicate dates, preserve different dates and mark the planner approved');
                const reloadedApproved = new window.planner.constructor(window.storage, window.repository, window.ruleEngine);
                assert(reloadedApproved.getCurrentWeekInfo().weekStartDate === '2026-11-14' &&
                    reloadedApproved.getCurrentWeek().status === 'Approved',
                    'The approved original week must remain selected after reload');
                reloadedApproved.setSchoolLunch(0, false);
                assert(reloadedApproved.getCurrentWeek().status === 'Draft' &&
                    !reloadedApproved.getCurrentWeek().approvedDate && window.storage.get('history')[key].plan.Saturday.schoolLunch,
                    'Changing an approved plan must make it a draft without changing history');
                const duplicateHistory = window.storage.get('history');
                duplicateHistory[duplicateKey] = { ...structuredClone(duplicateHistory[key]), key: duplicateKey };
                window.storage.set('history', duplicateHistory);
                reloadedApproved.approvePlan();
                savedHistory = window.storage.get('history');
                assert(Object.keys(savedHistory).length === 2 && !savedHistory[duplicateKey] &&
                    !savedHistory[key].plan.Saturday.schoolLunch &&
                    reloadedApproved.getCurrentWeek().status === 'Approved' &&
                    window.storage.get('weekly-plans')[key].status === 'Approved',
                    'Reapproving from the planner must replace history and persist approved status');
                reloadedApproved.regenerateMealType('lunch');
                assert(reloadedApproved.getCurrentWeek().status === 'Draft',
                    'Regenerating an approved meal type must make it a draft');
                reloadedApproved.editHistoryEntry(key);
                assert(window.historyManager.copyHistoryToCurrent(otherKey) &&
                    !window.storage.get('current-week').editingHistoryKey,
                    'Copying history into an editing draft must clear the replacement target');
                reloadedApproved.editHistoryEntry(key);
                window.historyManager.deleteHistoryEntry(key);
                savedHistory = window.storage.get('history');
                assert(!savedHistory[key] && savedHistory[otherKey] &&
                    !window.storage.get('current-week').editingHistoryKey &&
                    !window.storage.get('weekly-plans')[key].editingHistoryKey &&
                    window.storage.get('current-week').status === 'Draft',
                    'Deletion must remove only the chosen entry and leave any draft as an ordinary draft');
                let rejectedMissing = false;
                try { window.historyManager.deleteHistoryEntry(key); } catch (error) { rejectedMissing = true; }
                assert(rejectedMissing, 'Deleting a missing entry must report an error');

                const breakfast = window.repository.addMeal({
                    name: 'Egg', mealTypes: ['Breakfast'], categories: ['Breakfast']
                });
                window.repository.addMeal({ name: 'Apple', mealTypes: ['Breakfast'], categories: ['Fruit'] });
                reloadedApproved.approvePlan();
                reloadedApproved.setMealComponent(0, 'breakfast', 'breakfast', breakfast.id);
                assert(reloadedApproved.getCurrentWeek().status === 'Draft',
                    'Manually changing a component must make an approved plan a draft');
                reloadedApproved.approvePlan();
                reloadedApproved.regenerateDay(0);
                assert(reloadedApproved.getCurrentWeek().status === 'Draft',
                    'Regenerating a day must make an approved plan a draft');
                reloadedApproved.approvePlan();
                const replacement = window.repository.getPlanningMealsByType('Breakfast')[0];
                reloadedApproved.replaceMeal(0, 'breakfast', replacement.id);
                assert(reloadedApproved.getCurrentWeek().status === 'Draft',
                    'Replacing a meal must make an approved plan a draft');
                reloadedApproved.approvePlan();
                reloadedApproved.generateWeekPlan();
                assert(reloadedApproved.getCurrentWeek().status === 'Draft',
                    'Generating the whole week must make an approved plan a draft');

                const missingDraft = reloadedApproved.getCurrentWeek();
                missingDraft.editingHistoryKey = 'missing';
                reloadedApproved.saveCurrentWeek(missingDraft);
                let rejectedApproval = false;
                try { reloadedApproved.approvePlan(); } catch (error) { rejectedApproval = true; }
                assert(rejectedApproval && reloadedApproved.getCurrentWeek().status === 'Draft',
                    'A missing history entry must not produce an approved planner');

                const legacyDates = { weekKey: '2026-W47',
                    weekStartDate: '2026-11-16', weekEndDate: '2026-11-22' };
                window.storage.set('history', {
                    '2026-W47': { key: '2026-W47', year: 2026, weekNumber: 47, plan: originalPlan },
                    '2026-W47#2': { key: '2026-W47#2', year: 2026, weekNumber: 47,
                        ...legacyDates, plan: originalPlan },
                    '2026-W47@2026-11-17': { key: '2026-W47@2026-11-17', year: 2026, weekNumber: 47,
                        weekStartDate: '2026-11-17', weekEndDate: '2026-11-23', plan: originalPlan }
                });
                window.storage.saveToHistory(47, 2026, originalPlan, {}, legacyDates);
                savedHistory = window.storage.get('history');
                assert(Object.keys(savedHistory).length === 2 && savedHistory['2026-W47'] &&
                    !savedHistory['2026-W47#2'] && savedHistory['2026-W47@2026-11-17'],
                    'Legacy Monday history must consolidate without removing a different start date');

                window.storage.set('history', {
                    '2026-W47': { key: '2026-W47', year: 2026, weekNumber: 47,
                        weekStartDate: '2026-11-17', weekEndDate: '2026-11-23', plan: originalPlan }
                });
                window.storage.saveToHistory(47, 2026, originalPlan, {}, legacyDates);
                savedHistory = window.storage.get('history');
                assert(savedHistory['2026-W47'].weekStartDate === '2026-11-17' &&
                    savedHistory['2026-W47#2'].weekStartDate === '2026-11-16',
                    'A key collision must not overwrite an entry for different dates');

                window.storage.set('settings', { planningStartDay: 'Saturday' });
                window.planner = new window.planner.constructor(window.storage, window.repository, window.ruleEngine);
                window.planner.setTargetWeek('2027-W01');
                const refresh = ui.displayCurrentWeek;
                ui.displayCurrentWeek = () => {};
                const blank = window.planner.getCurrentWeek().plan;
                const saturdayCard = ui.createDayCard('Saturday', 0, blank.Saturday, 'Jan 9');
                const sundayCard = ui.createDayCard('Sunday', 1, blank.Sunday, 'Jan 10');
                const fridayCard = ui.createDayCard('Friday', 6, blank.Friday, 'Jan 15');
                const mondayCard = ui.createDayCard('Monday', 2, blank.Monday, 'Jan 11');
                const testCards = document.createElement('div');
                testCards.append(saturdayCard, sundayCard, fridayCard, mondayCard);
                document.body.appendChild(testCards);
                assert(!saturdayCard.textContent.includes('School lunch') && !sundayCard.textContent.includes('School lunch') &&
                    mondayCard.textContent.includes('School lunch') &&
                    saturdayCard.querySelector('[aria-label="Skip lunch on Saturday"]') &&
                    sundayCard.querySelector('[aria-label="Skip lunch on Sunday"]') &&
                    fridayCard.querySelectorAll('input[aria-label^="Order "]').length === 2 &&
                    !mondayCard.querySelector('input[aria-label^="Order "]'),
                    'School lunch must be weekday-only and ordering controls must appear only for Friday through Sunday');
                saturdayCard.querySelector('[aria-label="Skip lunch on Saturday"]').click();
                sundayCard.querySelector('[aria-label="Order lunch on Sunday"]').click();
                sundayCard.querySelector('[aria-label="Order dinner on Sunday"]').click();
                fridayCard.querySelector('[aria-label="Order dinner on Friday"]').click();
                let selected = window.planner.getCurrentWeek().plan;
                assert(selected.Saturday.skipLunch && !selected.Sunday.skipLunch &&
                    selected.Sunday.orderedLunch && selected.Sunday.orderedDinner && selected.Friday.orderedDinner,
                    'Independent UI selections must persist to the correct days and meals');
                assert(ui.getEmptySlotsMessage({
                    Saturday: { breakfast: {}, lunch: null, dinner: null, skipLunch: true, orderedDinner: true },
                    Sunday: { breakfast: {}, lunch: null, dinner: null, orderedLunch: true, orderedDinner: true }
                }) === '', 'Intentionally excluded meals must not be reported as missing');
                window.planner.approvePlan();
                const selectedKey = window.planner.getCurrentWeekInfo().weekKey;
                const savedSelection = window.storage.get('history')[selectedKey];
                assert(savedSelection.plan.Saturday.skipLunch && savedSelection.plan.Sunday.orderedLunch &&
                    savedSelection.plan.Sunday.orderedDinner && savedSelection.plan.Friday.orderedDinner,
                    'Approval must persist skip and ordering choices in history');
                const selectionHistory = ui.createHistoryItem(savedSelection);
                const selectionDays = selectionHistory.querySelectorAll('.history-day-preview');
                assert(selectionDays[0].textContent.includes('Lunch: Skipped') &&
                    selectionDays[1].textContent.includes('Lunch: Order food') &&
                    selectionDays[1].textContent.includes('Dinner: Order food'),
                    'History must distinguish skipped and ordered meals');
                window.planner.editHistoryEntry(selectedKey);
                assert(window.planner.getCurrentWeek().plan.Sunday.orderedDinner,
                    'Editing history must restore ordering selections');
                const orderedCard = ui.createDayCard('Sunday', 1, window.planner.getCurrentWeek().plan.Sunday, 'Jan 10');
                testCards.appendChild(orderedCard);
                const previousAlert = window.alert;
                let message = '';
                window.alert = text => { message = text; };
                orderedCard.querySelector('[aria-label="Order lunch on Sunday"]').click();
                assert(!window.planner.getCurrentWeek().plan.Sunday.orderedLunch &&
                    !window.planner.getCurrentWeek().plan.Sunday.lunch &&
                    message.includes('No meal could be generated for Sunday lunch'),
                    'Unchecking ordering must report when no meal can be generated');
                const skippedCard = ui.createDayCard('Saturday', 0, window.planner.getCurrentWeek().plan.Saturday, 'Jan 9');
                testCards.appendChild(skippedCard);
                message = '';
                skippedCard.querySelector('[aria-label="Skip lunch on Saturday"]').click();
                assert(!window.planner.getCurrentWeek().plan.Saturday.skipLunch &&
                    !window.planner.getCurrentWeek().plan.Saturday.lunch &&
                    message.includes('No meal could be generated for Saturday lunch'),
                    'Unchecking skipped lunch must report when no meal can be generated');
                window.planner.setSchoolLunch(6, true);
                const schoolCard = ui.createDayCard('Friday', 6, window.planner.getCurrentWeek().plan.Friday, 'Jan 15');
                testCards.appendChild(schoolCard);
                message = '';
                [...schoolCard.querySelectorAll('label')].find(label => label.textContent === 'School lunch')
                    .querySelector('input').click();
                assert(!window.planner.getCurrentWeek().plan.Friday.schoolLunch &&
                    !window.planner.getCurrentWeek().plan.Friday.lunch &&
                    message.includes('No meal could be generated for Friday lunch'),
                    'Unchecking school lunch must report when no meal can be generated');
                window.planner.setSchoolLunch(0, true);
                const legacyCard = ui.createDayCard('Saturday', 0, window.planner.getCurrentWeek().plan.Saturday, 'Jan 9');
                testCards.appendChild(legacyCard);
                assert(![...legacyCard.querySelectorAll('label')].some(label => label.textContent.includes('School lunch')) &&
                    legacyCard.textContent.includes('Remove previous school lunch'),
                    'Existing weekend school lunch must remain visible and removable');
                [...legacyCard.querySelectorAll('button')].find(button => button.textContent === 'Remove previous school lunch').click();
                assert(!window.planner.getCurrentWeek().plan.Saturday.schoolLunch,
                    'Removing a legacy weekend school lunch must persist');
                window.storage.set('rules', []);
                window.repository.addMeal({ name: 'Test protein', mealTypes: ['Lunch', 'Dinner'], categories: ['Protein'] });
                window.repository.addMeal({ name: 'Test starch', mealTypes: ['Lunch', 'Dinner'], categories: ['Starch'] });
                window.repository.addMeal({ name: 'Test vegetable', mealTypes: ['Lunch', 'Dinner'], categories: ['Vegetables'] });
                window.planner.setOrderedMeal(1, 'dinner', true);
                const restoreOrderCard = ui.createDayCard('Sunday', 1, window.planner.getCurrentWeek().plan.Sunday, 'Jan 10');
                testCards.appendChild(restoreOrderCard);
                message = '';
                restoreOrderCard.querySelector('[aria-label="Order dinner on Sunday"]').click();
                assert(window.planner.getCurrentWeek().plan.Sunday.dinner && !message,
                    'Unchecking ordering must generate a meal without an error when one is available');
                window.planner.setSkipLunch(0, true);
                const restoreSkipCard = ui.createDayCard('Saturday', 0, window.planner.getCurrentWeek().plan.Saturday, 'Jan 9');
                testCards.appendChild(restoreSkipCard);
                restoreSkipCard.querySelector('[aria-label="Skip lunch on Saturday"]').click();
                assert(window.planner.getCurrentWeek().plan.Saturday.lunch && !message,
                    'Unchecking skip lunch must generate a meal when one is available');
                window.planner.setSchoolLunch(6, true);
                const restoreSchoolCard = ui.createDayCard('Friday', 6, window.planner.getCurrentWeek().plan.Friday, 'Jan 15');
                testCards.appendChild(restoreSchoolCard);
                [...restoreSchoolCard.querySelectorAll('label')].find(label => label.textContent === 'School lunch')
                    .querySelector('input').click();
                assert(window.planner.getCurrentWeek().plan.Friday.lunch && !message,
                    'Unchecking school lunch must generate a meal when one is available');
                window.alert = previousAlert;
                testCards.remove();
                ui.displayCurrentWeek = refresh;
                document.getElementById('result').textContent = 'All history display tests passed.';
            } catch (error) {
                document.getElementById('result').textContent = `FAILED: ${error.message}`;
                throw error;
            }
        };
        document.head.appendChild(script);
    });
</script>
</body>
</html>
