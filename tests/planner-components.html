<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Planner component tests</title></head>
<body>
<pre id="result">Running...</pre>
<script>
    const data = {
        meals: [{
            id: 'curry', name: 'Curry', mealTypes: ['Lunch', 'Dinner'],
            categories: ['Protein', 'Vegetables'], ingredients: ['Chickpeas'],
            foodGroups: [], tags: [], cuisine: 'Indian', protein: 'Vegetarian',
            difficulty: 'Easy', mealPrepFriendly: false, mealPrepDays: 0
        }],
        recipes: [],
        'meal-components': { proteins: [], starches: ['Rice'], vegetables: [] },
        rules: []
    };
    window.storage = {
        get(key, fallback) { return data[key] === undefined ? fallback : structuredClone(data[key]); },
        set(key, value) { data[key] = structuredClone(value); }
    };
</script>
<script src="../js/repository.js"></script>
<script src="../js/rules.js"></script>
<script src="../js/planner.js"></script>
<script src="../js/shopping.js"></script>
<script>
    function assert(condition, message) {
        if (!condition) throw new Error(message);
    }

    try {
        const meals = window.repository.getPlanningMealsByType('Lunch');
        assert(meals.length === 1, 'Expected one complete combination');
        const meal = meals[0];
        assert(meal.componentItems.protein.id === 'curry' && meal.componentItems.vegetable.id === 'curry',
            'A multi-category item should fill both categories');
        assert(meal.componentItems.starch.name === 'Rice', 'Rice should be a separate starch item');
        assert(meal.ingredients.filter(ingredient => ingredient === 'Chickpeas').length === 1,
            'A reused item should contribute ingredients once');
        assert(window.repository.getPlanningMealsByType('Breakfast').length === 0,
            'Saved meal types must be respected');

        const pairingData = { meals: [], recipes: [],
            'meal-components': { proteins: ['Tofu'], starches: [], vegetables: [] } };
        const pairingStorage = {
            get(key, fallback) { return pairingData[key] === undefined ? fallback : structuredClone(pairingData[key]); },
            set(key, value) { pairingData[key] = structuredClone(value); }
        };
        const pairingRepo = new window.repository.constructor(pairingStorage);
        const ruleStub = { getRules: () => [], scoreMealPlacement: () => 1 };
        const pairingPlanner = new window.planner.constructor(pairingStorage, pairingRepo, ruleStub);

        const weekendData = {
            meals: [], recipes: [], 'meal-components': { proteins: [], starches: [], vegetables: [] },
            settings: { planningStartDay: 'Saturday' }, rules: [], history: { approved: { plan: 'snapshot' } }
        };
        const weekendStorage = {
            get(key, fallback) { return weekendData[key] === undefined ? fallback : structuredClone(weekendData[key]); },
            set(key, value) { weekendData[key] = structuredClone(value); }
        };
        const weekendRepo = new window.repository.constructor(weekendStorage);
        const weekendPlanner = new window.planner.constructor(weekendStorage, weekendRepo, ruleStub);
        const pancakes = weekendRepo.addMeal({
            name: 'Pancakes', mealTypes: ['Breakfast'], categories: ['Breakfast'], weekendOnly: true
        });
        const toast = weekendRepo.addMeal({
            name: 'Toast', mealTypes: ['Breakfast'], categories: ['Breakfast']
        });
        weekendRepo.addMeal({ name: 'Apple', mealTypes: ['Breakfast'], categories: ['Fruit'] });
        weekendRepo.addMeal({ name: 'Chicken', mealTypes: ['Lunch', 'Dinner'], categories: ['Protein'] });
        const weekendStarch = weekendRepo.addMeal({
            name: 'Potatoes', mealTypes: ['Lunch', 'Dinner'], categories: ['Starch'], weekendOnly: true
        });
        weekendRepo.addMeal({ name: 'Carrot', mealTypes: ['Lunch', 'Dinner'], categories: ['Vegetables'] });
        const weekendPlan = weekendPlanner.generateWeekPlan();
        assert(weekendPlanner.days[0] === 'Saturday' && weekendPlan.Saturday.breakfast.componentItems.breakfast.id === pancakes.id &&
            weekendPlan.Sunday.breakfast.componentItems.breakfast.id === pancakes.id &&
            weekendPlan.Monday.breakfast.componentItems.breakfast.id === toast.id &&
            weekendPlan.Saturday.lunch.componentItems.starch.id === weekendStarch.id &&
            weekendPlan.Sunday.dinner.componentItems.starch.id === weekendStarch.id && !weekendPlan.Monday.lunch,
            'Generation must use weekend-only breakfast and side components only on actual weekend days');
        for (const key of ['breakfast', 'fruit', 'protein', 'starch', 'vegetable']) {
            const candidate = { componentItems: { [key]: { id: key, weekendOnly: true } } };
            assert(!weekendPlanner.isMealAvailableOnDay(candidate, 2) &&
                weekendPlanner.isMealAvailableOnDay(candidate, 0) &&
                weekendPlanner.isMealAvailableOnDay(candidate, 1),
                `Weekend-only ${key} must be excluded on weekdays`);
        }
        assert(!weekendPlanner.isMealAvailableOnDay({ id: 'legacy', weekendOnly: true }, 2),
            'A standalone weekend-only meal must be excluded on weekdays');
        const priorityRules = {
            getRules: () => [],
            scoreMealPlacement: candidate => candidate.score
        };
        const priorityPlanner = new window.planner.constructor(weekendStorage, weekendRepo, priorityRules);
        const ordinary = { id: 'ordinary', score: 10000 };
        const weekendOne = { id: 'weekend-one', score: 1, componentItems: {
            protein: { id: 'weekend-protein', weekendOnly: true }
        } };
        const weekendTwo = { id: 'weekend-two', score: 0, componentItems: {
            protein: { id: 'weekend-protein', weekendOnly: true },
            starch: { id: 'weekend-starch', weekendOnly: true }
        } };
        const priorityPlan = priorityPlanner.initializeEmptyPlan();
        assert(priorityPlanner.selectBestMeal([ordinary, weekendOne], priorityPlan, 0, 'dinner').id === 'weekend-one' &&
            priorityPlanner.selectBestMeal([ordinary, weekendOne], priorityPlan, 1, 'dinner').id === 'weekend-one' &&
            priorityPlanner.selectBestMeal([ordinary, weekendOne], priorityPlan, 2, 'dinner').id === 'ordinary',
            'Weekend-only components must take priority over higher-scoring ordinary meals on weekends only');
        assert(priorityPlanner.selectBestMeal([weekendOne, weekendTwo], priorityPlan, 0, 'dinner').id === 'weekend-two',
            'Eligible combinations with more weekend-only components must be preferred');
        const betterWeekend = { ...weekendOne, id: 'better-weekend', score: 2 };
        assert(priorityPlanner.selectBestMeal([weekendOne, betterWeekend], priorityPlan, 0, 'dinner').id === 'better-weekend',
            'Normal scoring must break ties between equally preferred weekend combinations');
        const duplicatedItem = { id: 'same-component', weekendOnly: true };
        assert(priorityPlanner.getWeekendOnlyCount({ componentItems: {
            protein: duplicatedItem, vegetable: duplicatedItem
        } }) === 1, 'A component used in multiple categories must count only once');
        weekendPlanner.setMealComponent(2, 'breakfast', 'breakfast', pancakes.id);
        assert(weekendPlanner.getCurrentWeek().plan.Monday.breakfast.componentItems.breakfast.id === pancakes.id,
            'Manual selection must allow weekend-only components on weekdays');
        assert(weekendPlanner.regenerateDay(2).Monday.breakfast.componentItems.breakfast.id === toast.id,
            'Regenerating a weekday must replace a manually selected weekend-only component');
        const regeneratedBreakfasts = weekendPlanner.regenerateMealType('breakfast');
        assert(regeneratedBreakfasts.Saturday.breakfast.componentItems.breakfast.id === pancakes.id &&
            regeneratedBreakfasts.Monday.breakfast.componentItems.breakfast.id === toast.id,
            'Meal-type regeneration must respect weekend restrictions');
        weekendRepo.updateMeal(pancakes.id, { ...pancakes, weekendOnly: false });
        assert(!weekendRepo.getMeal(pancakes.id).weekendOnly,
            'Editing a component must persist removal of the weekend restriction');
        weekendRepo.updateMeal(pancakes.id, { ...pancakes, weekendOnly: true });
        const otherUpdates = weekendRepo.getMeal(pancakes.id);
        delete otherUpdates.weekendOnly;
        weekendRepo.updateMeal(pancakes.id, otherUpdates);
        assert(weekendRepo.getMeal(pancakes.id).weekendOnly,
            'Updates that omit the new setting must preserve it');
        const exportedWeekend = weekendRepo.exportMeals();
        weekendRepo.importMeals(exportedWeekend);
        assert(weekendRepo.getMeal(pancakes.id).weekendOnly,
            'The weekend restriction must survive meal export and import');

        const beforeClear = weekendPlanner.getCurrentWeek();
        beforeClear.status = 'Approved';
        beforeClear.approvedDate = '2026-01-01T00:00:00Z';
        beforeClear.plan.Monday.schoolLunch = true;
        beforeClear.editingHistoryKey = 'approved';
        weekendPlanner.saveCurrentWeek(beforeClear);
        const otherWeek = { plan: 'other week', status: 'Approved' };
        weekendData['weekly-plans'].other = structuredClone(otherWeek);
        const selectedWeek = weekendPlanner.getCurrentWeekInfo().weekKey;
        const clearedPlan = weekendPlanner.clearPlan();
        assert(Object.values(clearedPlan).every(day =>
            !day.breakfast && !day.lunch && !day.dinner && !day.schoolLunch) &&
            weekendPlanner.getCurrentWeek().status === 'Draft' &&
            !weekendPlanner.getCurrentWeek().approvedDate &&
            weekendPlanner.getCurrentWeek().editingHistoryKey === 'approved' &&
            weekendPlanner.getCurrentWeekInfo().weekKey === selectedWeek &&
            weekendData['weekly-plans'][selectedWeek].status === 'Draft' &&
            weekendData['weekly-plans'].other.plan === 'other week' &&
            weekendData.history.approved.plan === 'snapshot',
            'Clearing must reset only the selected week, leave history intact and persist a draft');
        const reopenedClear = new window.planner.constructor(weekendStorage, weekendRepo, ruleStub);
        assert(reopenedClear.getCurrentWeek().status === 'Draft' &&
            !reopenedClear.getCurrentWeek().plan.Monday.schoolLunch &&
            !reopenedClear.getCurrentWeek().plan.Saturday.breakfast,
            'The cleared plan must remain a draft after reopening');

        const rice = pairingRepo.addMeal({ name: 'Rice', mealTypes: ['Lunch', 'Dinner'], categories: ['Starch'] });
        const pasta = pairingRepo.addMeal({ name: 'Pasta', mealTypes: ['Lunch', 'Dinner'], categories: ['Starch'] });
        const bread = pairingRepo.addMeal({ name: 'Bread', mealTypes: ['Lunch', 'Dinner'], categories: ['Starch'] });
        const broccoli = pairingRepo.addMeal({ name: 'Broccoli', mealTypes: ['Lunch', 'Dinner'], categories: ['Vegetables'] });
        const carrot = pairingRepo.addMeal({ name: 'Carrot', mealTypes: ['Dinner'], categories: ['Vegetables'] });
        const chicken = pairingRepo.addMeal({
            name: 'Chicken', mealTypes: ['Lunch', 'Dinner'], categories: ['Protein'],
            pairings: { starches: [rice.id, pasta.id], vegetables: [broccoli.id, carrot.id] }
        });
        const tofuId = pairingRepo.getSimpleComponentId('proteins', 'Tofu');
        let pairingMeals = pairingRepo.getPlanningMealsByType('Lunch');
        assert(pairingMeals.filter(item => item.componentItems.protein.id === chicken.id).length === 2 &&
            pairingMeals.filter(item => item.componentItems.protein.id === tofuId).length === 3,
            'Configured proteins must match both lists, while unconfigured proteins remain unrestricted');
        pairingMeals = pairingRepo.getPlanningMealsByType('Dinner');
        assert(pairingMeals.filter(item => item.componentItems.protein.id === chicken.id).length === 4 &&
            pairingMeals.filter(item => item.componentItems.protein.id === chicken.id)
                .every(item => [rice.id, pasta.id].includes(item.componentItems.starch.id)),
            'Starch and vegetable choices must combine independently and respect meal types');
        pairingRepo.updateMeal(chicken.id, {
            ...chicken, pairings: { starches: [], vegetables: [broccoli.id] }
        });
        pairingMeals = pairingRepo.getPlanningMealsByType('Dinner')
            .filter(item => item.componentItems.protein.id === chicken.id);
        assert(pairingMeals.length === 3 && pairingMeals.every(item => item.componentItems.vegetable.id === broccoli.id),
            'An empty starch list must allow every starch while retaining vegetable restrictions');
        pairingRepo.updateMeal(chicken.id, {
            ...chicken, pairings: { starches: [rice.id], vegetables: [] }
        });
        pairingMeals = pairingRepo.getPlanningMealsByType('Dinner')
            .filter(item => item.componentItems.protein.id === chicken.id);
        assert(pairingMeals.length === 2 && pairingMeals.every(item => item.componentItems.starch.id === rice.id),
            'An empty vegetable list must allow every vegetable while retaining starch restrictions');
        pairingRepo.updateMeal(chicken.id, {
            ...chicken, pairings: { starches: [], vegetables: [] }
        });
        assert(pairingRepo.getComponent(chicken.id).pairings === null &&
            pairingRepo.getPlanningMealsByType('Dinner').filter(item => item.componentItems.protein.id === chicken.id).length === 6,
            'Two empty lists must allow every combination');
        pairingRepo.updateMeal(chicken.id, {
            ...chicken, pairings: { starches: ['@none', rice.id], vegetables: ['@none', broccoli.id] }
        });
        pairingMeals = pairingRepo.getPlanningMealsByType('Lunch')
            .filter(item => item.componentItems.protein.id === chicken.id);
        assert(pairingMeals.length === 4 &&
            pairingMeals.some(item => item.componentItems.starch && item.componentItems.vegetable) &&
            pairingMeals.some(item => item.omittedComponents.includes('starch') && item.componentItems.vegetable) &&
            pairingMeals.some(item => item.componentItems.starch && item.omittedComponents.includes('vegetable')) &&
            pairingMeals.some(item => item.omittedComponents.length === 2),
            'No starch and no vegetables must be independent choices alongside selected components');
        pairingRepo.updateMeal(chicken.id, chicken);
        const generatedPairings = pairingPlanner.generateWeekPlan();
        assert(Object.values(generatedPairings).every(day => ['lunch', 'dinner'].every(type =>
            day[type] && (day[type].componentItems.protein.id !== chicken.id ||
                ([rice.id, pasta.id].includes(day[type].componentItems.starch.id) &&
                    [broccoli.id, carrot.id].includes(day[type].componentItems.vegetable.id))))),
            'Generated meals must respect configured pairings');
        const regeneratedPairings = pairingPlanner.regenerateMealType('dinner');
        assert(Object.values(regeneratedPairings).every(day => day.dinner &&
            (day.dinner.componentItems.protein.id !== chicken.id || [rice.id, pasta.id].includes(day.dinner.componentItems.starch.id))),
            'Regenerated meals must respect configured pairings');
        pairingRepo.updateMeal(chicken.id, { ...chicken, name: 'Chicken updated', pairings: undefined });
        assert(pairingRepo.getComponent(chicken.id).pairings.starches[0] === rice.id &&
            JSON.parse(pairingRepo.exportMeals()).find(item => item.id === chicken.id).pairings.vegetables.length === 2,
            'Editing and exporting components must preserve pairings');
        pairingRepo.deleteMeal(rice.id);
        assert(pairingRepo.getPlanningMealsByType('Lunch').some(item =>
            item.componentItems.protein.id === chicken.id && item.componentItems.starch.id === pasta.id),
            'Other allowed components must remain usable after a component is deleted');
        pairingRepo.deleteMeal(pasta.id);
        assert(!pairingRepo.getPlanningMealsByType('Lunch').some(item => item.componentItems.protein.id === chicken.id),
            'A deleted allowed component must not silently permit other combinations');
        pairingPlanner.setMealComponent(0, 'lunch', 'protein', chicken.id);
        const manualPairing = pairingPlanner.setMealComponent(0, 'lunch', 'starch', bread.id);
        assert(manualPairing.componentItems.starch.id === bread.id,
            'Manual selections may override pairing restrictions');
        pairingRepo.updateSimpleMealComponent(tofuId, {
            name: 'Tofu', mealTypes: ['Lunch'], categories: ['Protein', 'Vegetables'],
            pairings: { starches: [bread.id], vegetables: ['@self'] }
        });
        assert(pairingRepo.getComponent(tofuId).pairings.vegetables[0] === tofuId &&
            pairingRepo.getPlanningMealsByType('Lunch').some(item =>
                item.componentItems.protein.id === tofuId && item.componentItems.vegetable.id === tofuId),
            'Edited simple components must retain their identities and may pair with themselves');
        let invalidPairingsRejected = false;
        try {
            pairingRepo.updateMeal(chicken.id, {
                ...pairingRepo.getComponent(chicken.id),
                pairings: { starches: null, vegetables: [broccoli.id] }
            });
        } catch (error) {
            invalidPairingsRejected = true;
        }
        assert(invalidPairingsRejected && pairingRepo.getComponent(chicken.id).pairings.starches.length === 2,
            'Invalid pairing updates must be rejected without changing saved restrictions');
        pairingRepo.updateMeal(chicken.id, {
            ...pairingRepo.getComponent(chicken.id), pairings: { starches: [], vegetables: [] }
        });
        assert(pairingRepo.getPlanningMealsByType('Lunch').some(item =>
            item.componentItems.protein.id === chicken.id && item.componentItems.starch.id === bread.id),
            'Clearing restrictions must allow all available combinations again');

        const noSidesData = { meals: [], recipes: [],
            'meal-components': { proteins: [], starches: [], vegetables: [] } };
        const noSidesStorage = {
            get(key, fallback) { return noSidesData[key] === undefined ? fallback : structuredClone(noSidesData[key]); },
            set(key, value) { noSidesData[key] = structuredClone(value); }
        };
        const noSidesRepo = new window.repository.constructor(noSidesStorage);
        const noSidesPlanner = new window.planner.constructor(noSidesStorage, noSidesRepo, ruleStub);
        const fish = noSidesRepo.addMeal({
            name: 'Fish', mealTypes: ['Lunch', 'Dinner'], categories: ['Protein'], ingredients: ['Fish'],
            mealPrepFriendly: true, mealPrepDays: 2,
            pairings: { starches: ['@none'], vegetables: ['@none'] }
        });
        noSidesRepo.updateMeal(fish.id, {
            ...fish, pairings: { starches: ['@none'], vegetables: [] }
        });
        assert(noSidesRepo.getPlanningMealsByType('Lunch').length === 0,
            'An empty vegetable list must not allow omission without selecting no vegetables');
        noSidesRepo.updateMeal(fish.id, {
            ...fish, pairings: { starches: [], vegetables: ['@none'] }
        });
        assert(noSidesRepo.getPlanningMealsByType('Lunch').length === 0,
            'An empty starch list must not allow omission without selecting no starch');
        noSidesRepo.updateMeal(fish.id, fish);
        const noSidesMeal = noSidesRepo.getPlanningMealsByType('Lunch')[0];
        assert(noSidesMeal && noSidesMeal.componentItems.protein.id === fish.id &&
            noSidesMeal.omittedComponents.join(',') === 'starch,vegetable' &&
            noSidesMeal.mealPrepFriendly && noSidesMeal.ingredients.join(',') === 'Fish',
            'A protein can form a complete meal without either category, including for meal prep');
        assert(JSON.parse(noSidesRepo.exportMeals())[0].pairings.starches.includes('@none'),
            'Omission choices must survive component export');
        const noSidesPlan = noSidesPlanner.generateWeekPlan();
        assert(noSidesPlan[noSidesPlanner.days[0]].lunch.omittedComponents.length === 2 &&
            noSidesPlanner.regenerateDay(0)[noSidesPlanner.days[0]].dinner.omittedComponents.length === 2,
            'Generation and day regeneration must work without any starch or vegetable components');
        const noSidesShopping = new window.shoppingManager.constructor(noSidesStorage, noSidesRepo);
        assert(noSidesShopping.generateShoppingList().every(item => item.name === 'Fish'),
            'Omitted sides must not appear on the shopping list');
        const side = noSidesRepo.addMeal({ name: 'Rice', mealTypes: ['Lunch'], categories: ['Starch'] });
        const withSide = noSidesPlanner.setMealComponent(0, 'lunch', 'starch', side.id);
        assert(withSide.componentItems.starch.id === side.id &&
            !withSide.omittedComponents.includes('starch') && withSide.omittedComponents.includes('vegetable'),
            'Manually adding a side must clear its omission while preserving other omissions');
        assert(noSidesRepo.getPlanningMealsByType('Lunch').every(item => !item.componentItems.starch),
            'Selecting only no starch must not generate a starch even when one exists');

        const sharedRice = {
            id: 'other', componentItems: {
                protein: { id: 'chicken' },
                starch: meal.componentItems.starch,
                vegetable: { id: 'carrot' }
            }
        };
        const comparison = window.planner.initializeEmptyPlan();
        comparison.Monday.breakfast = sharedRice;
        assert(window.ruleEngine.ruleAvoidSameMealDay(meal, comparison, 0, 'lunch') === 100 &&
            window.ruleEngine.ruleAvoidConsecutive(meal, comparison, 1, 'lunch') === 100,
            'Shared starch must not block meals on the same or consecutive days');
        const fruitMeal = { componentItems: { fruit: { id: 'apple' } } };
        comparison.Monday.breakfast = fruitMeal;
        assert(window.ruleEngine.ruleAvoidSameMealDay(fruitMeal, comparison, 0, 'lunch') === 0 &&
            window.ruleEngine.ruleAvoidConsecutive(fruitMeal, comparison, 1, 'breakfast') === 0,
            'Fruit repeat restrictions must still apply');
        const prepFruit = { componentItems: { fruit: { id: 'apple', mealPrepFriendly: true, mealPrepDays: 2 } } };
        assert(window.ruleEngine.ruleAvoidConsecutive(prepFruit, comparison, 1, 'breakfast') === 100,
            'Meal-prep fruit can repeat for its configured consecutive days');
        comparison.Wednesday.breakfast = fruitMeal;
        assert(window.ruleEngine.ruleAvoidConsecutive(prepFruit, comparison, 1, 'breakfast') === 0,
            'Fruit meal prep must not exceed its consecutive-day limit');

        const weekly = { id: 'component-repeat-policy', enabled: true, strength: 100 };
        data.rules.push(weekly);
        const tikka = { componentItems: {
            protein: { id: 'tikka' }, starch: { id: 'rice' }, vegetable: { id: 'broccoli' }
        } };
        const anotherProtein = { componentItems: {
            protein: { id: 'other-protein' }, starch: { id: 'rice' }, vegetable: { id: 'broccoli' }
        } };
        const sideReuse = window.planner.initializeEmptyPlan();
        sideReuse.Friday.lunch = tikka;
        sideReuse.Saturday.lunch = anotherProtein;
        sideReuse.Sunday.lunch = anotherProtein;
        assert(window.planner.selectBestMeal([tikka], sideReuse, 5, 'dinner'),
            'The same rice and vegetables must not block a Friday-lunch to Saturday-dinner protein repeat');
        const variety = { id: 'vary-sides', enabled: true, strength: 75 };
        data.rules.push(variety);
        const differentSides = { componentItems: {
            protein: { id: 'tikka' }, starch: { id: 'potato' }, vegetable: { id: 'carrot' }
        } };
        assert(window.planner.selectBestMeal([tikka, differentSides], sideReuse, 5, 'dinner')
            .componentItems.vegetable.id === 'carrot',
            'Side variety must favor less-used starch and vegetables, including later days');
        assert(window.planner.selectBestMeal([tikka], sideReuse, 5, 'dinner'),
            'Side variety must not prohibit repeats when no alternative is available');
        variety.enabled = false;
        assert(window.planner.selectBestMeal([tikka, differentSides], sideReuse, 5, 'dinner')
            .componentItems.vegetable.id === 'broccoli',
            'Disabling side variety must restore normal scoring');
        data.rules.pop();
        const replacing = window.planner.initializeEmptyPlan();
        replacing.Saturday.dinner = tikka;
        assert(window.ruleEngine.ruleVarySides(tikka, replacing, 5, 'dinner') === 100,
            'The slot being regenerated must not count as a previous use');
        const legacySides = window.planner.initializeEmptyPlan();
        legacySides.Monday.lunch = { components: { protein: 'Tofu', starch: 'Rice', vegetable: 'Broccoli' } };
        assert(window.planner.selectBestMeal(
            [{ components: { protein: 'Beans', starch: 'Rice', vegetable: 'Broccoli' } }],
            legacySides, 1, 'dinner'),
            'Legacy starch and vegetable components must also be allowed to repeat');
        assert(window.ruleEngine.ruleVarySides(
            { components: { protein: 'Beans', starch: 'Rice', vegetable: 'Broccoli' } },
            legacySides, 1, 'dinner') < 100,
            'Side variety must recognize legacy components');
        const weekComparison = window.planner.initializeEmptyPlan();
        weekComparison.Monday.breakfast = sharedRice;
        assert(window.ruleEngine.ruleAvoidComponentWeek(meal, weekComparison, 2, 'lunch') === 100,
            'The weekly rule must not restrict shared starch or vegetables');
        const breakfastMeal = { componentItems: {
            breakfast: { id: 'pancakes' }, fruit: { id: 'apple' }
        } };
        weekComparison.Monday.breakfast = { componentItems: {
            breakfast: { id: 'toast' }, fruit: { id: 'apple' }
        } };
        assert(window.ruleEngine.ruleAvoidComponentWeek(breakfastMeal, weekComparison, 2, 'breakfast') === 100,
            'The weekly rule must not restrict shared fruit');
        weekComparison.Monday.breakfast = breakfastMeal;
        assert(window.ruleEngine.applyRule(weekly, breakfastMeal, weekComparison, 2, 'breakfast') === 0,
            'A breakfast component must not repeat after a gap');
        const secondBreakfast = { componentItems: {
            breakfast: { id: 'pancakes' }, fruit: { id: 'pear' }
        } };
        assert(!window.planner.selectBestMeal([secondBreakfast], weekComparison, 1, 'breakfast'),
            'A breakfast component must not repeat on consecutive days even with different fruit');
        const prepBreakfast = structuredClone(secondBreakfast);
        prepBreakfast.componentItems.breakfast.mealPrepFriendly = true;
        prepBreakfast.componentItems.breakfast.mealPrepDays = 2;
        assert(!window.planner.selectBestMeal([prepBreakfast], weekComparison, 1, 'breakfast'),
            'Meal prep must not exempt breakfast from the weekly restriction');
        assert(window.ruleEngine.applyRule(weekly, breakfastMeal, weekComparison, 0, 'breakfast') === 100,
            'Replacing the current breakfast slot must not conflict with itself');
        const ordinaryBreakfast = { id: 'ordinary-breakfast', componentItems: {
            breakfast: { id: 'toast' }, fruit: { id: 'pear' }
        } };
        const weekendBreakfast = { id: 'weekend-breakfast', componentItems: {
            breakfast: { id: 'pancakes', weekendOnly: true }, fruit: { id: 'apple' }
        } };
        assert(window.planner.selectBestMeal([weekendBreakfast, ordinaryBreakfast], weekComparison, 5, 'breakfast')
            .id === 'ordinary-breakfast', 'Weekend priority must not bypass the breakfast repeat rule');
        weekComparison.Monday.breakfast = null;
        weekComparison.Friday.breakfast = breakfastMeal;
        assert(!window.planner.selectBestMeal([secondBreakfast], weekComparison, 0, 'breakfast'),
            'Regenerating an earlier day must check breakfasts later in the week');
        weekComparison.Friday.breakfast = null;
        weekComparison.Friday.breakfast = { components: { breakfast: 'Pancakes', fruit: 'Apple' } };
        assert(!window.planner.selectBestMeal(
            [{ components: { breakfast: 'Pancakes', fruit: 'Pear' } }], weekComparison, 0, 'breakfast'),
            'The breakfast restriction must recognize legacy components');
        weekComparison.Friday.breakfast = null;
        const sharedProtein = { componentItems: {
            protein: meal.componentItems.protein, starch: { id: 'other-starch' }
        } };
        weekComparison.Monday.dinner = sharedProtein;
        assert(window.ruleEngine.applyRule(weekly, meal, weekComparison, 2, 'lunch') === 0 &&
            !window.planner.selectBestMeal([meal], weekComparison, 2, 'lunch'),
            'A protein used earlier in the week must be blocked even on nonconsecutive days');
        assert(window.planner.selectBestMeal([meal], weekComparison, 1, 'lunch') &&
            window.ruleEngine.applyRule(weekly, meal, weekComparison, 1, 'dinner') === 0 &&
            window.ruleEngine.applyRule(weekly, meal, weekComparison, 0, 'lunch') === 0,
            'A protein may repeat at lunch after dinner, but not at dinner again or on the same day');
        weekComparison.Monday.dinner = null;
        weekComparison.Monday.lunch = sharedProtein;
        assert(window.planner.selectBestMeal([meal], weekComparison, 1, 'dinner') &&
            window.ruleEngine.applyRule(weekly, meal, weekComparison, 1, 'lunch') === 0,
            'A protein may repeat at dinner after lunch, but not at lunch again');
        weekComparison.Tuesday.dinner = sharedProtein;
        assert(window.ruleEngine.applyRule(weekly, meal, weekComparison, 2, 'lunch') === 0 &&
            window.ruleEngine.applyRule(weekly, meal, weekComparison, 6, 'dinner') === 0,
            'A protein cannot be used a third time, even on a consecutive day');
        weekComparison.Monday.lunch = null;
        weekComparison.Tuesday.dinner = null;
        weekComparison.Wednesday.dinner = sharedProtein;
        assert(window.planner.selectBestMeal([meal], weekComparison, 1, 'lunch') &&
            !window.planner.selectBestMeal([meal], weekComparison, 1, 'dinner'),
            'Regenerating an earlier day must check the following day and opposite meal slot');
        weekComparison.Wednesday.dinner = null;
        weekComparison.Monday.dinner = sharedProtein;
        weekComparison.Monday.lunch = meal;
        assert(window.ruleEngine.applyRule(weekly, meal, weekComparison, 0, 'lunch') === 0,
            'Another meal on the same day remains a conflict while replacing the target slot');
        weekComparison.Monday.dinner = null;
        assert(window.ruleEngine.applyRule(weekly, meal, weekComparison, 0, 'lunch') === 100,
            'The target slot must not conflict with itself');
        weekComparison.Monday.lunch = null;
        weekComparison.Monday.breakfast = { components: { protein: 'Tofu' } };
        const legacyProtein = { components: { protein: 'Tofu', starch: 'Rice' } };
        assert(window.ruleEngine.applyRule(weekly, legacyProtein, weekComparison, 4, 'lunch') === 0,
            'Weekly repetition must recognize legacy component plans');
        weekComparison.Monday.breakfast = null;
        weekComparison.Monday.dinner = sharedProtein;
        const rotatedDays = ['Saturday', 'Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
        const rotatedWeek = window.planner.initializeEmptyPlan();
        rotatedWeek.Saturday.dinner = sharedProtein;
        window.ruleEngine.days = rotatedDays;
        assert(window.ruleEngine.applyRule(weekly, meal, rotatedWeek, 2, 'lunch') === 0,
            'Weekly repetition must follow the configured start day across Sunday and Monday');
        window.ruleEngine.days = [...window.planner.days];
        weekly.enabled = false;
        assert(window.planner.selectBestMeal([meal], weekComparison, 1, 'dinner') &&
            window.planner.selectBestMeal([meal], weekComparison, 4, 'lunch'),
            'Disabling the combined rule must permit consecutive and nonconsecutive repeats');
        weekly.enabled = true;
        const futurePlan = window.planner.initializeEmptyPlan();
        futurePlan.Friday.dinner = meal;
        window.planner.saveCurrentWeek(window.planner.createWeekRecord(futurePlan));
        const regeneratedDay = window.planner.regenerateDay(0);
        assert(!regeneratedDay.Monday.lunch && !regeneratedDay.Monday.dinner,
            'Regenerating an earlier day must not repeat a component already used later in the week');
        const regeneratedType = window.planner.regenerateMealType('lunch');
        assert(!regeneratedType.Monday.lunch && regeneratedType.Friday.dinner,
            'Regenerating a meal type must respect unchanged meals elsewhere in the week');
        const restrictedWeek = window.planner.generateWeekPlan();
        assert(restrictedWeek.Monday.lunch && !restrictedWeek.Wednesday.lunch,
            'Week generation must leave later slots empty rather than repeat a component');

        const simpleData = { rules: [weekly] };
        const simpleStorage = {
            get(key, fallback) { return simpleData[key] === undefined ? fallback : structuredClone(simpleData[key]); },
            set(key, value) { simpleData[key] = structuredClone(value); }
        };
        const simpleMeals = {
            Breakfast: [breakfastMeal, secondBreakfast],
            Lunch: [{ componentItems: { protein: { id: 'tofu' } } }],
            Dinner: [{ componentItems: { protein: { id: 'tofu' } } }]
        };
        const simpleRepository = { getPlanningMealsByType(type) { return simpleMeals[type]; } };
        const simpleEngine = new window.ruleEngine.constructor(simpleStorage, simpleRepository);
        const simplePlanner = new window.planner.constructor(simpleStorage, simpleRepository, simpleEngine);
        const simplePlan = simplePlanner.generateWeekPlan();
        assert(simplePlan.Monday.breakfast && !simplePlan.Tuesday.breakfast && !simplePlan.Wednesday.breakfast &&
            simplePlan.Monday.lunch && simplePlan.Tuesday.dinner &&
            !simplePlan.Tuesday.lunch && !simplePlan.Wednesday.lunch && !simplePlan.Wednesday.dinner,
            'Generation must use a breakfast only once but still allow a lunch-to-dinner protein pair');
        const rotatedData = { rules: [weekly], settings: { planningStartDay: 'Saturday' } };
        const rotatedStorage = {
            get(key, fallback) { return rotatedData[key] === undefined ? fallback : structuredClone(rotatedData[key]); },
            set(key, value) { rotatedData[key] = structuredClone(value); }
        };
        const rotatedRepo = { getPlanningMealsByType(type) {
            return type === 'Breakfast' ? [ordinaryBreakfast, weekendBreakfast] : [];
        } };
        const rotatedEngine = new window.ruleEngine.constructor(rotatedStorage, rotatedRepo);
        const rotatedPlanner = new window.planner.constructor(rotatedStorage, rotatedRepo, rotatedEngine);
        const generatedWeekend = rotatedPlanner.generateWeekPlan();
        assert(generatedWeekend.Saturday.breakfast.id === 'weekend-breakfast' &&
            generatedWeekend.Sunday.breakfast.id === 'ordinary-breakfast' &&
            !generatedWeekend.Monday.breakfast,
            'Generation must prefer a weekend breakfast once and fall back rather than repeat it');
        const laterWeekend = rotatedPlanner.initializeEmptyPlan();
        laterWeekend.Sunday.breakfast = weekendBreakfast;
        rotatedPlanner.saveCurrentWeek(rotatedPlanner.createWeekRecord(laterWeekend));
        assert(rotatedPlanner.regenerateDay(0).Saturday.breakfast.id === 'ordinary-breakfast',
            'Regeneration must not prioritize a weekend breakfast already used later in the week');
        data.rules.pop();

        const plan = window.planner.generateWeekPlan();
        assert(plan.Monday.lunch && plan.Monday.dinner && plan.Tuesday.lunch,
            'Generation without the repeat rule must allow repeats');
        const regenerated = window.planner.regenerateMealType('lunch');
        assert(regenerated.Monday.lunch && regenerated.Tuesday.lunch,
            'Regeneration without the repeat rule must allow repeats');

        data.meals[0].categories = ['Protein'];
        assert(window.repository.getPlanningMealsByType('Lunch').length === 0,
            'Generation must not produce an incomplete combination');
        data.recipes.push({ mealId: 'curry', categories: ['Vegetables'] });
        assert(window.repository.getPlanningMealsByType('Lunch').length === 1,
            'Linked recipe categories should make a saved item eligible');

        const riceId = meal.componentItems.starch.id;
        data.recipes.push({ id: 'rice-recipe', mealId: riceId });
        assert(window.repository.getComponent(riceId).name === 'Rice',
            'Existing simple components must be available for recipe links');
        assert(window.repository.getPlanningMealsByType('Lunch')[0].componentItems.starch.id === riceId,
            'Existing simple component identities must remain stable in generated plans');
        window.repository.removeSimpleMealComponent('starches', 0);
        assert(data.recipes.find(recipe => recipe.id === 'rice-recipe').mealId === null,
            'Removing a simple component must unlink its recipes');
        assert(data.recipes.find(recipe => recipe.mealId === 'curry'),
            'Removing a component must not unlink other recipes');

        data['meal-components'].starches.push('Pasta');
        const pastaId = window.repository.getSimpleComponentId('starches', 'Pasta');
        data.recipes.push({ id: 'pasta-recipe', mealId: pastaId });
        window.repository.updateSimpleMealComponent(pastaId, {
            name: 'Whole-grain pasta', mealTypes: ['Lunch'], categories: ['Starch'],
            ingredients: ['Pasta'], foodGroups: [], tags: []
        });
        assert(window.repository.getComponent(pastaId).name === 'Whole-grain pasta',
            'Editing a simple component must preserve its identity');
        assert(!data['meal-components'].starches.length &&
            data.recipes.find(recipe => recipe.id === 'pasta-recipe').mealId === pastaId,
            'Editing a simple component must preserve its recipe link without duplicating it');
        assert(window.repository.getPlanningMealsByType('Lunch')[0].componentItems.starch.id === pastaId,
            'Edited components must remain available to the planner');
        window.repository.deleteMeal(pastaId);
        assert(data.recipes.find(recipe => recipe.id === 'pasta-recipe').mealId === null,
            'Deleting an edited component must unlink its recipes');

        const egg = window.repository.addMeal({ name: 'Egg', mealTypes: ['Breakfast'], categories: ['Breakfast'] });
        window.repository.addMeal({ name: 'Bread', mealTypes: ['Breakfast'], categories: ['Starch'] });
        window.repository.addMeal({ name: 'Carrot', mealTypes: ['Breakfast'], categories: ['Vegetables'] });
        assert(window.repository.getPlanningMealsByType('Breakfast').length === 0,
            'Breakfast needs fruit, not a vegetable');
        const apple = window.repository.addMeal({ name: 'Apple', mealTypes: ['Breakfast'], categories: ['Fruit'] });
        const photoCredit = { title: 'Apple photo', author: 'Artist', license: 'CC BY 4.0',
            sourceUrl: 'https://commons.wikimedia.org/wiki/File:Apple.jpg',
            licenseUrl: 'https://creativecommons.org/licenses/by/4.0/' };
        window.repository.updateMeal(apple.id, { ...apple, imageUrl: 'https://example.com/apple.jpg', imageCredit: photoCredit });
        assert(window.repository.getComponent(apple.id).imageCredit.author === 'Artist' &&
            JSON.parse(window.repository.exportMeals()).find(item => item.id === apple.id).imageUrl === 'https://example.com/apple.jpg',
            'Component photo URLs and attribution must survive editing and export');
        const appleWithPhoto = window.repository.getComponent(apple.id);
        window.repository.updateMeal(apple.id, { ...appleWithPhoto, imageUrl: 'https://example.com/other.jpg', imageCredit: undefined });
        assert(window.repository.getComponent(apple.id).imageCredit === null,
            'Replacing a photo URL must not keep the old photo attribution');
        const pear = window.repository.addMeal({ name: 'Pear', mealTypes: ['Breakfast'], categories: ['Fruit'] });
        const breakfasts = window.repository.getPlanningMealsByType('Breakfast');
        assert(breakfasts.length === 2 && breakfasts.every(item =>
            item.componentItems.breakfast.id === egg.id && item.componentItems.fruit &&
            !item.componentItems.protein && !item.componentItems.starch && !item.componentItems.vegetable),
            'Generated breakfast must contain only breakfast and fruit components');
        assert(!window.repository.getComponentsByCategory('Breakfast', 'Breakfast').some(item => item.name === 'Bread'),
            'A breakfast meal type alone must not make a starch eligible for the breakfast category');
        const linkedBreakfast = window.repository.addMeal({
            name: 'Omelette', mealTypes: ['Breakfast'], categories: ['Protein']
        });
        data.recipes.push({ mealId: linkedBreakfast.id, categories: ['Breakfast'] });
        assert(window.repository.getComponentsByCategory('Breakfast', 'Breakfast')
            .some(item => item.id === linkedBreakfast.id),
            'A linked recipe may assign the Breakfast category to its component');
        window.repository.addMeal({ name: 'Lunch rice', mealTypes: ['Lunch'], categories: ['Starch'] });
        const lunches = window.repository.getPlanningMealsByType('Lunch');
        assert(lunches.length === 1 && lunches.every(item => item.componentItems.vegetable && !item.componentItems.fruit),
            'Generated lunch must include vegetables');

        delete data['current-week'];
        const partial = window.planner.setMealComponent(0, 'breakfast', 'fruit', apple.id);
        assert(partial.componentItems.fruit.id === apple.id && !partial.componentItems.breakfast,
            'A component must be selectable without filling other slots or generating a week');
        assert(window.planner.getCurrentWeek().plan.Monday.breakfast.ingredients.includes('Apple'),
            'A partial meal must be persisted with shopping ingredients');
        window.planner.setMealComponent(0, 'breakfast', 'breakfast', egg.id);
        const replaced = window.planner.setMealComponent(0, 'breakfast', 'fruit', pear.id);
        assert(replaced.componentItems.breakfast.id === egg.id &&
            replaced.componentItems.fruit.id === pear.id && !replaced.ingredients.includes('Apple'),
            'Changing a component must preserve the other slots and recalculate ingredients');
        assert(window.shoppingManager.generateShoppingList().some(item => item.name === 'Pear'),
            'The shopping list must include manually selected components');
        window.planner.setSchoolLunch(0, true);
        let rejected = false;
        try { window.planner.setMealComponent(0, 'lunch', 'protein', 'curry'); } catch (error) { rejected = true; }
        assert(rejected && !window.planner.getCurrentWeek().plan.Monday.lunch,
            'School lunch must not accept components');

        window.planner.setTargetWeek('2026-W46');
        window.planner.setSchoolLunch(0, true);
        const mondayKey = window.planner.getCurrentWeekInfo().weekKey;
        data.settings = { planningStartDay: 'Saturday' };
        window.planner.setPlanningStartDay('Saturday');
        let weekInfo = window.planner.getCurrentWeekInfo();
        assert(weekInfo.weekStartDate === '2026-11-14' && weekInfo.weekEndDate === '2026-11-20' &&
            window.planner.days.join(',') === 'Saturday,Sunday,Monday,Tuesday,Wednesday,Thursday,Friday',
            'Saturday planning must cover Saturday through Friday');
        assert(data['weekly-plans'][mondayKey].plan.Monday.schoolLunch && !window.planner.getCurrentWeek().plan.Monday.schoolLunch,
            'Changing the start day must preserve the existing Monday plan in a separate period');
        window.planner.setSchoolLunch(0, true);
        assert(window.planner.getCurrentWeek().plan.Saturday.schoolLunch, 'Day indexes must use the selected order');
        const orderedPlan = window.planner.initializeEmptyPlan();
        orderedPlan.Sunday.breakfast = { id: 'repeat', mealPrepFriendly: false, mealPrepDays: 0 };
        assert(window.ruleEngine.ruleAvoidConsecutive({ id: 'repeat' }, orderedPlan, 2, 'breakfast') === 0,
            'Consecutive rules must follow the selected order across Sunday and Monday');
        window.planner.setTargetWeek('2026-W47');
        assert(window.planner.getCurrentWeekInfo().weekStartDate === '2026-11-21',
            'Selecting a later ISO week must retain the chosen start day');
        window.planner.setTargetWeek('2026-W46');
        assert(window.planner.getCurrentWeek().plan.Saturday.schoolLunch, 'Returning to a period must restore its plan');
        data.settings.planningStartDay = 'Monday';
        window.planner.setPlanningStartDay('Monday');
        assert(window.planner.getCurrentWeek().plan.Monday.schoolLunch,
            'Switching back must restore the original Monday plan');
        weekInfo = window.planner.getWeekInfo(new Date('2027-01-03T00:00:00Z'));
        assert(weekInfo.year === 2026 && weekInfo.weekNumber === 53 &&
            weekInfo.weekEndDate === '2027-01-09', 'ISO week-year must be correct across New Year');
        window.planner.weekdays.forEach((startDay, index) => {
            data.settings.planningStartDay = startDay;
            window.planner.setPlanningStartDay(startDay);
            window.planner.setTargetWeek('2026-W53');
            const expected = new Date('2026-12-28T00:00:00Z');
            expected.setUTCDate(expected.getUTCDate() + index);
            const info = window.planner.getCurrentWeekInfo();
            assert(info.weekStartDate === expected.toISOString().slice(0, 10) &&
                info.year === 2026 && info.weekNumber === 53 && window.planner.days[0] === startDay,
                `Week selection must handle ${startDay} across New Year`);
        });
        const now = new Date();
        const isoThursday = new Date(Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()));
        isoThursday.setUTCDate(isoThursday.getUTCDate() + 4 - (isoThursday.getUTCDay() || 7));
        data.history = { saturday: {
            year: isoThursday.getUTCFullYear(), weekNumber: window.ruleEngine.getWeekNumber(now),
            plan: { Saturday: { breakfast: { id: 'recent-item' } } }
        } };
        assert(window.ruleEngine.ruleAvoidRecentMeals({ id: 'recent-item' }) === 30,
            'Recent-meal rules must include history saved for non-Monday periods');

        document.getElementById('result').textContent = 'All planner component tests passed.';
    } catch (error) {
        document.getElementById('result').textContent = `FAILED: ${error.message}`;
        throw error;
    }
</script>
</body>
</html>
